[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traverse"
version = "0.1.0"
description = "TraVerse — trace any variant through the verse (VRS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Emmanuel Akosah" }]
dependencies = [
    "ga4gh.vrs[extras]>=2.3,<2.4",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "diskcache>=5.6",
]

[project.scripts]
vrs-explain = "traverse.cli:main"

[tool.setuptools.packages.find]
include = ["traverse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
